# Publishes n8n-nodes-veycall to npm with a provenance statement, as n8n requires for verified community nodes.
# Runs when a version tag is pushed:  npm version patch && git push --follow-tags
# Needs the repository secret NPM_TOKEN (an npm automation token with publish rights on n8n-nodes-veycall).
name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # n8n's release command: lint, build, then npm publish with provenance (it sets RELEASE_MODE, which
      # the prepublishOnly guard requires, so a plain `npm publish` is refused).
      - run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
